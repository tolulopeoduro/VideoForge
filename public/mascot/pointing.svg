<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <filter id="bulbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="bulbGlass" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.6" />
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="180" r="140" fill="#fef08a" opacity="0.3" filter="url(#bulbGlow)" />

  <!-- SUIT BODY & TORSO -->
  <g id="body">
    <!-- Back jacket base -->
    <path d="M 160 380 L 100 680 L 400 680 L 340 380 Z" fill="url(#suitGrad)" stroke="#090d16" stroke-width="6" />

    <!-- White Turtleneck Sweater -->
    <path d="M 190 310 L 195 380 Q 250 400 305 380 L 310 310 Z" fill="#f8fafc" stroke="#090d16" stroke-width="6" />
    <path d="M 200 330 Q 250 345 300 330" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <path d="M 205 355 Q 250 370 295 355" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

    <!-- Navy Suit Shoulders and Jacket Front (Dynamic posture) -->
    <path d="M 190 325 C 135 340 100 390 85 450 L 145 560 L 220 540 L 210 380 Z" fill="url(#suitGrad)" stroke="#090d16" stroke-width="6" />
    <path d="M 310 325 C 370 330 405 370 425 410 L 370 540 L 280 540 L 290 380 Z" fill="url(#suitGrad)" stroke="#090d16" stroke-width="6" />

    <!-- Navy Lapels -->
    <path d="M 195 340 L 150 440 L 235 480 L 230 385 Z" fill="url(#lapelGrad)" stroke="#090d16" stroke-width="6" />
    <path d="M 305 340 L 350 440 L 265 480 L 270 385 Z" fill="url(#lapelGrad)" stroke="#090d16" stroke-width="6" />

    <!-- Pocket & Square -->
    <path d="M 135 470 L 175 460" stroke="#090d16" stroke-width="5" stroke-linecap="round" />
    <polygon points="148,468 156,450 166,466" fill="#f59e0b" stroke="#090d16" stroke-width="3" />

    <!-- Center Line & Buttons -->
    <path d="M 250 480 L 250 680" stroke="#090d16" stroke-width="5" />
    <circle cx="250" cy="520" r="7" fill="#334155" stroke="#090d16" stroke-width="3" />
    <circle cx="250" cy="580" r="7" fill="#334155" stroke="#090d16" stroke-width="3" />
  </g>

  <!-- FORMAL WHITE GLOVES (Pointing Pose: Right gloved hand pointing emphatically rightward, Left hand confident on hip) -->
  <g id="gloves-pointing">
    <!-- Left Hand on Hip -->
    <path d="M 110 440 Q 60 500 100 550" fill="none" stroke="#090d16" stroke-width="6" />
    <g transform="translate(90, 520)">
      <!-- Left Glove clenched on hip -->
      <path d="M 10 10 Q 30 5 45 20 C 50 40 30 50 15 45 C 0 40 0 20 10 10 Z" fill="#ffffff" stroke="#090d16" stroke-width="5" />
      <path d="M 20 18 L 30 35" stroke="#090d16" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Right Arm pointing emphatically to the right/overlay -->
    <path d="M 380 400 L 440 390 L 450 390" stroke="#090d16" stroke-width="7" fill="none" />
    <!-- Formal Glove: Hand with extended index finger -->
    <g transform="translate(370, 360)">
      <!-- Fist body -->
      <path d="M 30 35 C 30 20 50 20 60 30 L 115 25 C 125 25 125 40 115 42 L 68 45 C 75 48 75 60 62 62 L 55 63 C 62 68 58 78 45 78 L 25 75 C 10 70 15 45 30 35 Z" 
            fill="#ffffff" stroke="#090d16" stroke-width="5" stroke-linejoin="round" />
      <!-- Knuckle details and seams -->
      <path d="M 45 42 L 40 68" stroke="#090d16" stroke-width="3" stroke-linecap="round" />
      <path d="M 55 45 L 50 65" stroke="#090d16" stroke-width="3" stroke-linecap="round" />
      <!-- Speed/emphasis streaks for point -->
      <path d="M 125 22 L 140 18" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <path d="M 128 33 L 148 33" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
      <path d="M 125 44 L 140 48" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- BRASS BULB COLLAR & THREADS -->
  <g id="bulb-base">
    <rect x="215" y="270" width="70" height="12" rx="4" fill="url(#brassGrad)" stroke="#090d16" stroke-width="4" />
    <rect x="220" y="284" width="60" height="12" rx="4" fill="url(#brassGrad)" stroke="#090d16" stroke-width="4" />
    <rect x="225" y="298" width="50" height="14" rx="4" fill="url(#brassGrad)" stroke="#090d16" stroke-width="4" />
    <path d="M 235 312 L 265 312 L 255 322 L 245 322 Z" fill="#334155" stroke="#090d16" stroke-width="3" />
  </g>

  <!-- LIGHTBULB HEAD & POINTING EXPRESSION -->
  <g id="head">
    <!-- Bulb Glass Outline -->
    <path d="M 215 270 C 180 260 140 220 140 160 C 140 90 190 40 250 40 C 310 40 360 90 360 160 C 360 220 320 260 285 270 Z" 
          fill="url(#bulbGlass)" stroke="#090d16" stroke-width="7" stroke-linejoin="round" />

    <!-- Highlights -->
    <path d="M 165 110 C 160 135 160 165 170 185" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <circle cx="178" cy="88" r="6" fill="#ffffff" opacity="0.85" />

    <!-- Filament Loop -->
    <path d="M 225 260 L 230 195 Q 235 175 250 175 Q 265 175 270 195 L 275 260" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
    <path d="M 238 185 C 235 155 245 150 250 150 C 255 150 265 155 262 185" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" filter="url(#bulbGlow)" />

    <!-- Eyes (Looking rightward towards the pointing gesture!) -->
    <!-- Left Eye -->
    <ellipse cx="220" cy="155" rx="14" ry="19" fill="#090d16" />
    <circle cx="225" cy="150" r="5" fill="#ffffff" />
    <circle cx="222" cy="162" r="2.5" fill="#ffffff" />
    <path d="M 205 130 Q 220 122 235 130" fill="none" stroke="#090d16" stroke-width="4.5" stroke-linecap="round" />

    <!-- Right Eye (Playful wink or focused gaze looking right) -->
    <ellipse cx="290" cy="155" rx="14" ry="19" fill="#090d16" />
    <circle cx="295" cy="150" r="5" fill="#ffffff" />
    <circle cx="292" cy="162" r="2.5" fill="#ffffff" />
    <path d="M 275 125 Q 290 118 305 128" fill="none" stroke="#090d16" stroke-width="5" stroke-linecap="round" />

    <!-- Confident Smirk / Smile pointing right -->
    <path d="M 232 205 Q 255 218 280 198" fill="none" stroke="#090d16" stroke-width="5" stroke-linecap="round" />
    <path d="M 280 198 L 285 204" stroke="#090d16" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
