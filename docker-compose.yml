services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vf
      POSTGRES_PASSWORD: vf
      POSTGRES_DB: vf
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    # Local dev only. Swap for R2/S3 in production.
    # Uses Silo S3 (direct MinIO open-source drop-in, as Docker Hub minio/minio was archived)
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
